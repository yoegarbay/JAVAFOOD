<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVAFOOD · Editar Reseña</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--orange:#d17a22;--dark:#0d0804;--card:rgba(28,16,8,0.98);
    --cream:#f5e8d3;--muted:rgba(245,232,211,0.42);
    --border:rgba(209,122,34,0.20);--glow:rgba(209,122,34,0.28);
    --green:#4caf50;--red:#e05555;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;}

  nav{background:rgba(18,10,4,.98);border-bottom:2px solid var(--orange);
      box-shadow:0 0 28px var(--glow);padding:13px 32px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;}
  .brand{font-size:1.4rem;font-weight:900;color:#fff;text-decoration:none;}
  .brand span{color:var(--orange);}
  .brand small{font-size:.65rem;background:rgba(209,122,34,.18);color:var(--orange);
    border-radius:4px;padding:2px 7px;margin-left:8px;font-weight:700;
    text-transform:uppercase;vertical-align:middle;}
  .nav-links a{color:var(--cream);text-decoration:none;margin-left:18px;
    font-weight:600;opacity:.5;transition:.2s;font-size:.85rem;}
  .nav-links a:hover{color:var(--orange);opacity:1;}

  .page{max-width:560px;margin:0 auto;padding:40px 24px;}
  .breadcrumb{font-size:.8rem;opacity:.4;margin-bottom:24px;}
  .breadcrumb a{color:var(--orange);text-decoration:none;}

  #loading{text-align:center;padding:60px 20px;opacity:.45;}

  .edit-card{background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:36px;box-shadow:0 0 40px rgba(0,0,0,.5);}
  .edit-header{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .edit-header h2{font-size:1.2rem;font-weight:900;}
  .edit-header h2 span{color:var(--orange);}
  .badge-id{background:rgba(209,122,34,.15);color:var(--orange);border-radius:6px;
    padding:4px 12px;font-size:.78rem;font-weight:700;}

  .info-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;}
  .info-item .label{font-size:.65rem;text-transform:uppercase;letter-spacing:.09em;
    opacity:.38;margin-bottom:5px;}
  .info-item .value{font-size:.93rem;font-weight:600;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;
    color:var(--orange);font-weight:700;margin-bottom:8px;}

  /* Estrellas */
  #star-picker{display:flex;gap:6px;margin-bottom:8px;}
  #star-picker .s{font-size:2rem;cursor:pointer;color:#333;transition:.1s;user-select:none;}
  #star-picker .s.on{color:#f5a623;}
  #star-label{font-size:.82rem;opacity:.5;min-height:1.2em;}

  textarea{width:100%;min-height:100px;background:rgba(0,0,0,.4);
    border:1px solid rgba(209,122,34,.3);color:var(--cream);border-radius:10px;
    padding:12px 14px;font-family:inherit;font-size:.9rem;outline:none;
    resize:vertical;transition:.2s;}
  textarea:focus{border-color:var(--orange);box-shadow:0 0 8px var(--glow);}
  textarea::placeholder{opacity:.35;}

  .actions{display:flex;gap:12px;margin-top:24px;}
  .btn-save{flex:1;padding:13px;background:linear-gradient(135deg,var(--orange),#f0932b);
    border:none;border-radius:11px;color:#fff;font-family:inherit;
    font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;}
  .btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 18px var(--glow);}
  .btn-save:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-cancel{padding:13px 22px;background:transparent;
    border:1px solid rgba(245,232,211,.2);color:var(--muted);
    border-radius:11px;font-family:inherit;font-size:.9rem;cursor:pointer;transition:.2s;
    text-decoration:none;display:inline-flex;align-items:center;}
  .btn-cancel:hover{border-color:rgba(245,232,211,.5);color:var(--cream);}

  .msg{padding:12px 16px;border-radius:10px;margin-top:14px;
    font-size:.88rem;font-weight:600;text-align:center;display:none;}
  .msg.ok{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);color:var(--green);}
  .msg.err{background:rgba(224,85,85,.15);border:1px solid rgba(224,85,85,.3);color:var(--red);}
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="brand">JAVA<span>FOOD</span><small>Admin</small></a>
  <div class="nav-links">
    <a href="index.html">← Reseñas</a>
    <a href="/index.html">Inicio</a>
  </div>
</nav>

<div class="page">
  <div class="breadcrumb">
    <a href="index.html">Reseñas</a> › Editar reseña <span id="titulo-id"></span>
  </div>

  <div id="loading">⏳ Cargando reseña...</div>

  <div id="contenido" style="display:none">
    <div class="edit-card">
      <div class="edit-header">
        <h2>Editar <span>Reseña</span></h2>
        <span class="badge-id" id="titulo-id-badge"></span>
      </div>

      <div class="info-row">
        <div class="info-item">
          <div class="label">Producto</div>
          <div class="value" id="info-producto">—</div>
        </div>
        <div class="info-item">
          <div class="label">Cliente</div>
          <div class="value" id="info-cliente">—</div>
        </div>
      </div>

      <div class="field">
        <label>Puntuación</label>
        <div id="star-picker">
          <span class="s" data-v="1">★</span>
          <span class="s" data-v="2">★</span>
          <span class="s" data-v="3">★</span>
          <span class="s" data-v="4">★</span>
          <span class="s" data-v="5">★</span>
        </div>
        <div id="star-label">Selecciona una puntuación</div>
      </div>

      <div class="field">
        <label>Comentario</label>
        <textarea id="inp-comentario" placeholder="Comentario del cliente..."></textarea>
      </div>

      <div class="actions">
        <a href="index.html" class="btn-cancel">Cancelar</a>
        <button class="btn-save" id="btn-save" onclick="guardar()">💾 Guardar cambios</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<script>
var id = new URLSearchParams(location.search).get('id');
var puntuacionActual = 0;

async function cargar() {
    if (!id) {
        document.getElementById('loading').innerHTML = "<p style='color:#e05555;text-align:center'>No se indicó id de reseña.</p>";
        return;
    }
    try {
        var res = await fetch('/api/admin/resenas/' + id);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var r = await res.json();

        document.getElementById('titulo-id').textContent      = '#' + r.id_resena;
        document.getElementById('titulo-id-badge').textContent = '#' + r.id_resena;
        document.getElementById('info-producto').textContent   = r.nombre_producto || '—';
        document.getElementById('info-cliente').textContent    = r.nombre_cliente  || '—';
        document.getElementById('inp-comentario').value        = r.comentario || '';

        setEstrellas(r.puntuacion);

        document.getElementById('loading').style.display   = 'none';
        document.getElementById('contenido').style.display = 'block';
    } catch (err) {
        document.getElementById('loading').innerHTML =
            '<p style="color:#e05555;text-align:center">Error: ' + err.message + '</p>';
    }
}

function setEstrellas(n) {
    puntuacionActual = n;
    document.querySelectorAll('#star-picker .s').forEach(function(el) {
        el.classList.toggle('on', parseInt(el.dataset.v) <= n);
    });
    var labels = ['', 'Muy mala', 'Mala', 'Regular', 'Buena', 'Excelente'];
    document.getElementById('star-label').textContent = labels[n] || 'Selecciona una puntuación';
}

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('#star-picker .s').forEach(function(el) {
        el.addEventListener('click', function() { setEstrellas(parseInt(el.dataset.v)); });
        el.addEventListener('mouseover', function() {
            var v = parseInt(el.dataset.v);
            document.querySelectorAll('#star-picker .s').forEach(function(s) {
                s.classList.toggle('on', parseInt(s.dataset.v) <= v);
            });
        });
        el.addEventListener('mouseout', function() { setEstrellas(puntuacionActual); });
    });
});

async function guardar() {
    if (!puntuacionActual) { mostrarMsg('err', 'Selecciona una puntuación.'); return; }
    var comentario = document.getElementById('inp-comentario').value.trim();
    var btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Guardando...';

    try {
        var res = await fetch('/api/admin/resenas/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ puntuacion: puntuacionActual, comentario: comentario || null })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        mostrarMsg('ok', '✅ Reseña actualizada correctamente');
        setTimeout(function() { location.href = 'index.html'; }, 1400);
    } catch (err) {
        mostrarMsg('err', '❌ ' + err.message);
        btn.disabled = false; btn.textContent = '💾 Guardar cambios';
    }
}

function mostrarMsg(tipo, texto) {
    var msg = document.getElementById('msg');
    msg.className = 'msg ' + tipo;
    msg.textContent = texto;
    msg.style.display = 'block';
}

cargar();
</script>
</body>
</html>
