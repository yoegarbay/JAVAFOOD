<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaFood | Hamburguesas</title>
    <link rel="stylesheet" href="JAVAFOOD.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        .sub-nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .sub-btn {
            padding: 8px 18px; border-radius: 10px; border: 1px solid var(--primary-orange);
            background: transparent; color: var(--cream); cursor: pointer; font-family: inherit;
            font-size: 0.85rem; transition: 0.2s;
        }
        .sub-btn.active, .sub-btn:hover { background: var(--primary-orange); color: var(--coffee-dark); font-weight: bold; }
        .card-desc { font-size: 0.72rem; color: rgba(245,232,211,0.5); margin: 4px 0 8px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="code-overlay"></div>
    <div class="kiosk-container">
        <aside class="sidebar">
            <div class="logo-area">
                <img src="Javafoodlogo.png" alt="Logo" class="main-logo">
                <h1>Java<span>Food</span></h1>
            </div>
            <nav class="nav-links">
                <button class="nav-btn" onclick="location.href='Menus.html'">🍱 MENÚS</button>
                <button class="nav-btn active" onclick="location.href='Principales.html'">🍔 PRINCIPALES</button>
                <button class="nav-btn" onclick="location.href='Complementos.html'">🍟 COMPLEMENTOS</button>
                <button class="nav-btn" onclick="location.href='Salsas.html'">🍯 SALSAS</button>
                <button class="nav-btn" onclick="location.href='Bebidas.html'">🥤 BEBIDAS</button>
                <button class="nav-btn" onclick="location.href='Postres.html'">🎂 POSTRES</button>
				<button class="nav-btn" onclick="location.href='Promociones.html'">🎁 PROMOCIONES</button>
            </nav>
            <div class="cart-box">
                <h3 class="cart-title">Tu Pedido</h3>
                <div class="cart-items-list"></div>
                <div class="total-row">
                    <span>Total:</span>
                    <span class="total-price">0.00€</span>
                </div>
                <button class="pay-btn">PAGAR AHORA</button>
                <button class="clear-btn" onclick="carrito=[];guardarCarrito();">🗑️ Vaciar pedido</button>
            </div>
        </aside>
        <main class="main-view">
            <header class="top-info">
                <span>Explorando: <strong>HAMBURGUESAS</strong></span>
                <span class="highlight">6 Disponibles</span>
          <div id="auth-area"></div>
        <a href="AdminHamburguesas.html" style="margin-left:auto;background:transparent;border:1px solid rgba(231,76,60,0.7);padding:6px 16px;border-radius:10px;color:#e74c3c;cursor:pointer;font-size:0.8rem;font-weight:bold;text-decoration:none;display:inline-flex;align-items:center;gap:4px;" onmouseover="this.style.background='#e74c3c';this.style.color='white'" onmouseout="this.style.background='transparent';this.style.color='#e74c3c'">⚙️ ADMIN</a></header>
            <div class="promo-banner" style="background: linear-gradient(90deg, #1a0e08, #8b4a14);">
                <div class="promo-content">
                    <h2>BURGER <br><span>STACK</span></h2>
                    <p>Carne 100% artesanal. Sin límites de sabor.</p>
                </div>
                <span style="font-size: 80px;">🍔</span>
            </div>
            <div class="sub-nav">
                <button class="sub-btn active" onclick="location.href='Hamburguesas.html'">🍔 Hamburguesas</button>
                <button class="sub-btn" onclick="location.href='Pizzas.html'">🍕 Pizzas</button>
                <button class="sub-btn" onclick="location.href='Bocatas.html'">🥙 Bocatas & Kebabs</button>
            </div>
            <div class="food-grid" id="grid-hamburguesas"></div>
        </main>
    </div>
<script src="main.js"></script>
<script>
    const hamburguesas = [
        { nombre: 'CheeseBurger',   precio: 8.50,  imagen: 'Imagenes/Principales/Cheeseburger.png', desc: 'Carne, queso, pepinillos, cebolla, kétchup, mostaza' },
        { nombre: 'BBQ Burger',     precio: 9.50,  imagen: 'Imagenes/Principales/BBQ.png',          desc: 'Carne, queso, bacon, salsa BBQ, pulled pork' },
        { nombre: 'Bacon Burger',   precio: 9.90,  imagen: 'Imagenes/Principales/Beicon.png',       desc: 'Carne, queso, bacon, mermelada de bacon, salsa de llave ácida' },
        { nombre: 'La Completa',    precio: 9.00,  imagen: 'Imagenes/Principales/Completa.png',     desc: 'Carne, queso, cebolla, tomate, lechuga, pepinillos, ketchup, mayonesa' },
        { nombre: 'La Trufada',     precio: 11.50, imagen: 'Imagenes/Principales/Trufada.png',      desc: 'Carne, queso, cebolla caramelizada, jamón ibérico, mayonesa trufada' },
        { nombre: 'Chicken Burger', precio: 8.90,  imagen: 'Imagenes/Principales/Chicken.png',      desc: 'Pollo frito, lechuga, pepinillos, mayonesa sriracha' }
    ];

    async function cargarHamburguesas() {
        let items = hamburguesas; // fallback por defecto

        try {
            const res = await fetch('/api/productos/categoria/Hamburguesas');
            if (res.ok) {
                const data = await res.json();
                if (data.length > 0) items = data.map(p => ({ id_producto: p.id_producto, nombre: p.nombre, precio: p.precio, desc: '', imagen: p.imagen || '' }));
            }
        } catch (e) { /* usa fallback */ }

        const grid = document.getElementById('grid-hamburguesas');
        grid.innerHTML = items.map(p => `
            <div class="card" ${p.id_producto ? 'data-id="' + p.id_producto + '"' : ''}>
                <img src="${p.imagen || 'Imagenes/Principales/' + encodeURIComponent(p.nombre) + '.png'}"
                     onerror="this.style.display='none'" alt="${p.nombre}"
                     style="width:100%;height:140px;object-fit:cover;border-radius:15px;">
                <div class="card-body">
                    <h4>${p.nombre}</h4>
                    <p class="card-desc">${p.desc || ''}</p>
                    <div class="card-price">
                        <span>${p.precio.toFixed(2)}€</span>
                        <button>+</button>
                    </div>
                    <div class="card-stars">★★★★★</div>
                </div>
            </div>
        `).join('');
        if (typeof cargarEstrellasGrid === 'function') cargarEstrellasGrid('grid-hamburguesas');
    }

    cargarHamburguesas();
</script>
<script src="resenas.js"></script>
<script src="auth-rol.js"></script>
</body>
</html>
