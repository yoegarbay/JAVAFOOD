<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVAFOOD · Pago</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--orange:#d17a22;--dark:#2b1b12;--bg:#0d0804;--cream:#f5e8d3;
        --glass:rgba(43,27,18,0.92);--glow:rgba(209,122,34,0.35);--border:rgba(209,122,34,0.25);--red:#e05555;}
  *{font-family:'Space Grotesk',sans-serif;box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);min-height:100vh;}

  /* Navbar */
  nav{background:var(--glass);border-bottom:2px solid var(--orange);
      box-shadow:0 0 24px var(--glow);padding:14px 32px;
      display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:1.6rem;font-weight:900;color:#fff;text-decoration:none;}
  .brand span{color:var(--orange);}
  .nav-user{display:flex;align-items:center;gap:12px;font-size:.88rem;}
  .nav-user .saludo{opacity:.6;}
  .nav-user .nombre{color:var(--orange);font-weight:700;}
  .nav-user a{color:var(--cream);opacity:.5;text-decoration:none;transition:.2s;font-size:.82rem;}
  .nav-user a:hover{opacity:1;color:var(--orange);}
  .nav-login-btn{
    padding:7px 16px;border-radius:9px;background:var(--orange);color:var(--dark)!important;
    font-weight:800;font-size:.82rem;opacity:1!important;border:none;cursor:pointer;
    box-shadow:0 0 10px var(--glow);transition:.2s;white-space:nowrap;
  }
  .nav-login-btn:hover{background:#f0a040;box-shadow:0 0 18px var(--glow);}

  /* Layout */
  .pago-wrapper{display:flex;gap:24px;padding:36px 32px;max-width:1000px;margin:0 auto;flex-wrap:wrap;}

  /* Panel resumen */
  .pago-resumen{flex:1;min-width:280px;background:var(--glass);border:1px solid var(--border);
                border-radius:18px;padding:28px;}
  .pago-resumen h2{font-size:1rem;letter-spacing:2px;color:var(--orange);margin-bottom:20px;
                   border-bottom:1px solid var(--border);padding-bottom:12px;font-weight:700;}
  .resumen-tabla{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .resumen-tabla th{text-align:left;font-size:.7rem;color:rgba(245,232,211,.4);
                    padding:8px 4px;border-bottom:1px solid rgba(209,122,34,.1);letter-spacing:1px;}
  .resumen-tabla td{padding:10px 4px;border-bottom:1px solid rgba(209,122,34,.06);font-size:.88rem;}
  .resumen-tabla td:last-child{text-align:right;color:var(--orange);font-weight:700;}
  .resumen-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:900;
                 padding:14px 4px 0;border-top:1px solid var(--border);margin-top:10px;}
  .resumen-total span:last-child{color:var(--orange);}
  .carrito-vacio{text-align:center;padding:40px 20px;opacity:.35;}
  .carrito-vacio span{font-size:3rem;display:block;margin-bottom:12px;}

  /* Panel formulario */
  .pago-formulario{flex:1;min-width:280px;background:var(--glass);border:1px solid var(--border);
                   border-radius:18px;padding:28px;}
  .pago-formulario h2{font-size:1rem;letter-spacing:2px;color:var(--orange);margin-bottom:24px;
                      border-bottom:1px solid var(--border);padding-bottom:12px;font-weight:700;}

  /* Banner login */
  .banner-login{background:rgba(209,122,34,.08);border:1px solid rgba(209,122,34,.2);
                border-radius:12px;padding:12px 16px;margin-bottom:20px;
                display:flex;justify-content:space-between;align-items:center;font-size:.85rem;}
  .banner-login a{color:var(--orange);font-weight:700;text-decoration:none;}
  .banner-login a:hover{text-decoration:underline;}
  .banner-login.logged{background:rgba(76,175,80,.08);border-color:rgba(76,175,80,.2);}

  .form-group{margin-bottom:18px;}
  .form-group label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:1px;
                    color:var(--orange);font-weight:700;margin-bottom:8px;}
  .form-group input{width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(209,122,34,.4);
    border-radius:10px;padding:12px 14px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;transition:.2s;}
  .form-group input:focus{border-color:var(--orange);box-shadow:0 0 10px var(--glow);}
  .form-group input::placeholder{opacity:.4;}
  .form-group input:disabled{opacity:.5;cursor:not-allowed;}

  /* Método de pago */
  .metodos-pago{display:flex;gap:12px;}
  .metodo-card{flex:1;background:rgba(0,0,0,.4);border:2px solid rgba(209,122,34,.2);
               border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s;}
  .metodo-card:hover{border-color:rgba(209,122,34,.5);}
  .metodo-card.activo{border-color:var(--orange);background:rgba(209,122,34,.1);}
  .metodo-card span{display:block;font-size:2rem;margin-bottom:6px;}
  .metodo-card p{font-size:.78rem;letter-spacing:1px;margin:0;font-weight:700;}

  #seccion-tarjeta{display:none;margin-top:6px;}
  #seccion-tarjeta.visible{display:block;}
  .row-2{display:flex;gap:12px;}
  .row-2 .form-group{flex:1;}

  /* Botones */
  .btn-confirmar{width:100%;background:linear-gradient(45deg,#d17a22,#f5e8d3);color:var(--dark);
    border:none;border-radius:12px;padding:16px;font-family:inherit;font-size:1rem;
    font-weight:900;letter-spacing:2px;cursor:pointer;margin-top:10px;transition:.2s;}
  .btn-confirmar:hover{transform:translateY(-2px);box-shadow:0 0 20px var(--glow);}
  .btn-confirmar:active{transform:scale(.98);}
  .btn-confirmar:disabled{background:rgba(209,122,34,.2);color:rgba(245,232,211,.3);cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-volver{width:100%;background:transparent;border:1px solid rgba(245,232,211,.15);
    border-radius:12px;padding:13px;color:rgba(245,232,211,.5);font-family:inherit;
    font-size:.9rem;letter-spacing:1px;cursor:pointer;margin-top:10px;transition:.2s;}
  .btn-volver:hover{border-color:rgba(245,232,211,.4);color:var(--cream);}

  @media(max-width:640px){.pago-wrapper{padding:20px 16px;}.metodo-card p{font-size:.7rem;}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="brand">JAVA<span>FOOD</span></a>
  <div class="nav-user" id="nav-user">
    <span class="saludo">Hola,</span>
    <span class="nombre" id="nav-nombre">Invitado</span>
    <a href="login.html" id="nav-login-link" class="nav-login-btn">🔑 Entrar / Registrarse</a>
  </div>
</nav>

<div class="pago-wrapper">

  <!-- RESUMEN -->
  <section class="pago-resumen">
    <h2>🛒 RESUMEN DEL PEDIDO</h2>
    <div id="resumen-contenido"></div>
  </section>

  <!-- FORMULARIO -->
  <section class="pago-formulario">
    <h2>💳 DATOS DE PAGO</h2>

    <div class="banner-login" id="banner-login">
      <span>¿Tienes cuenta? Inicia sesión para rellenar tus datos</span>
      <a href="login.html?next=pago.html">Entrar</a>
    </div>

    <div class="form-group">
      <label>Nombre del cliente</label>
      <input type="text" id="input-nombre" placeholder="Ej: María García" maxlength="100" autocomplete="off">
    </div>

    <div class="form-group">
      <label>Método de pago</label>
      <div class="metodos-pago">
        <div class="metodo-card activo" id="btn-efectivo" onclick="seleccionarMetodo('EFECTIVO')">
          <span>💵</span><p>EFECTIVO</p>
        </div>
        <div class="metodo-card" id="btn-tarjeta" onclick="seleccionarMetodo('TARJETA')">
          <span>💳</span><p>TARJETA</p>
        </div>
      </div>
    </div>

    <div id="seccion-tarjeta">
      <div class="form-group">
        <label>Número de tarjeta</label>
        <input type="text" id="input-numero-tarjeta" placeholder="0000 0000 0000 0000" maxlength="19" oninput="formatearTarjeta(this)">
      </div>
      <div class="form-group">
        <label>Nombre en la tarjeta</label>
        <input type="text" id="input-nombre-tarjeta" placeholder="Nombre Apellido" maxlength="60">
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Caducidad</label>
          <input type="text" id="input-caducidad" placeholder="MM/AA" maxlength="5" oninput="formatearCaducidad(this)">
        </div>
        <div class="form-group">
          <label>CVV</label>
          <input type="password" id="input-cvv" placeholder="•••" maxlength="4">
        </div>
      </div>
    </div>

    <button class="btn-confirmar" id="btn-pagar" onclick="confirmarPago()">CONFIRMAR PAGO</button>
    <button class="btn-volver" onclick="history.back()">← VOLVER AL MENÚ</button>
  </section>
</div>

<script src="pago.js"></script>
<script>
// Detectar si hay sesión y prefill
const cliente = JSON.parse(sessionStorage.getItem("javafoodUser") || "null");
if (cliente) {
    const nombreCliente = cliente.nom || cliente.nombre || "";
    document.getElementById("nav-nombre").textContent = nombreCliente;
    document.getElementById("nav-login-link").textContent = "Cerrar sesión";
    document.getElementById("nav-login-link").onclick = (e) => {
        e.preventDefault();
        sessionStorage.removeItem("javafoodUser");
        location.reload();
    };
    // Ocultar el campo nombre y el banner — el usuario ya está identificado
    const nombreGroup = document.getElementById("input-nombre");
    if (nombreGroup) nombreGroup.closest(".form-group").style.display = "none";
    const banner = document.getElementById("banner-login");
    if (banner) {
        banner.className = "banner-login logged";
        banner.innerHTML = `<span>✅ Sesión iniciada como <strong style="color:var(--orange)">${nombreCliente}</strong></span>
                            <a href="#" onclick="sessionStorage.removeItem('javafoodUser');location.reload()">Cerrar sesión</a>`;
    }
} else {
    // Guest: show banner asking to login
}
</script>
</body>
</html>
