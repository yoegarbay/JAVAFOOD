<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVAFOOD · Editar Reseña</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--orange:#d17a22;--dark:#0d0804;--card:rgba(28,16,8,0.98);
    --cream:#f5e8d3;--muted:rgba(245,232,211,0.42);
    --border:rgba(209,122,34,0.20);--glow:rgba(209,122,34,0.28);
    --green:#4caf50;--red:#e05555;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;}
  nav{background:rgba(18,10,4,.98);border-bottom:2px solid var(--orange);
      box-shadow:0 0 28px var(--glow);padding:13px 32px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;}
  .brand{font-size:1.4rem;font-weight:900;color:#fff;text-decoration:none;}
  .brand span{color:var(--orange);}
  .brand small{font-size:.65rem;background:rgba(209,122,34,.18);color:var(--orange);
    border-radius:4px;padding:2px 7px;margin-left:8px;font-weight:700;
    text-transform:uppercase;vertical-align:middle;}
  .nav-links a{color:var(--cream);text-decoration:none;margin-left:18px;
    font-weight:600;opacity:.5;transition:.2s;font-size:.85rem;}
  .nav-links a:hover{color:var(--orange);opacity:1;}

  .page{max-width:580px;margin:0 auto;padding:40px 24px;}
  .breadcrumb{font-size:.8rem;opacity:.4;margin-bottom:24px;}
  .breadcrumb a{color:var(--orange);text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}

  .form-card{background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:36px;box-shadow:0 0 40px rgba(0,0,0,.5);}
  .form-card h2{font-size:1.2rem;font-weight:900;margin-bottom:8px;}
  .form-card h2 span{color:var(--orange);}
  .subtitle{opacity:.45;font-size:.85rem;margin-bottom:28px;}

  .readonly-info{background:rgba(0,0,0,.25);border:1px solid var(--border);
    border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:.88rem;}
  .readonly-info strong{color:var(--orange);}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.09em;color:var(--orange);font-weight:700;margin-bottom:8px;}

  /* Star picker */
  .star-picker{display:flex;gap:8px;margin-bottom:4px;}
  .star-picker .s{font-size:2.4rem;cursor:pointer;color:#333;transition:.12s;user-select:none;}
  .star-picker .s.on{color:#f5a623;}
  .star-picker .s:hover{transform:scale(1.12);}
  .star-label{font-size:.8rem;opacity:.45;margin-top:4px;}

  textarea{width:100%;min-height:110px;background:rgba(0,0,0,.5);
    border:1px solid rgba(209,122,34,.4);border-radius:12px;
    color:#fff;padding:12px 16px;font-family:inherit;font-size:.92rem;
    resize:vertical;outline:none;transition:.2s;}
  textarea:focus{border-color:var(--orange);box-shadow:0 0 10px var(--glow);}
  textarea::placeholder{opacity:.35;}

  .msg{padding:12px 16px;border-radius:10px;margin-bottom:16px;
    font-size:.85rem;font-weight:600;display:none;}
  .msg.ok {background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.3);color:var(--green);}
  .msg.err{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.3);color:var(--red);}

  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
  .btn-save{flex:1;padding:13px;background:linear-gradient(45deg,var(--orange),#f0932b);
    color:#1a0a02;font-weight:900;border:none;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:.95rem;transition:.2s;}
  .btn-save:hover{transform:translateY(-1px);box-shadow:0 0 18px var(--glow);}
  .btn-save:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-cancel{padding:13px 24px;background:transparent;border:1px solid var(--border);
    color:var(--muted);border-radius:12px;text-decoration:none;font-weight:600;
    font-size:.92rem;transition:.2s;text-align:center;}
  .btn-cancel:hover{border-color:rgba(209,122,34,.5);color:var(--cream);}
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="brand">JAVA<span>FOOD</span><small>Admin</small></a>
  <div class="nav-links">
    <a href="/admin/peliculas/index.html">Productos</a>
    <a href="/admin/pagos/index.html">Pedidos</a>
    <a href="/admin/resenas/index.html">Reseñas</a>
  </div>
</nav>

<div class="page">
  <p class="breadcrumb">
    <a href="index.html">← Reseñas</a> / Editar
  </p>

  <div id="loading" style="text-align:center;padding:60px 0;opacity:.5;">Cargando…</div>

  <div id="contenido" style="display:none">
    <div class="form-card">
      <h2>Editar Reseña <span id="titulo-id">#—</span></h2>
      <p class="subtitle">Solo puedes modificar la puntuación y el comentario.</p>

      <div class="readonly-info">
        📦 Producto: <strong id="info-producto">—</strong> &nbsp;|&nbsp;
        👤 Cliente: <strong id="info-cliente">—</strong>
      </div>

      <div class="field">
        <label>Puntuación</label>
        <div class="star-picker" id="star-picker">
          <span class="s" data-v="1">★</span>
          <span class="s" data-v="2">★</span>
          <span class="s" data-v="3">★</span>
          <span class="s" data-v="4">★</span>
          <span class="s" data-v="5">★</span>
        </div>
        <p class="star-label" id="star-label">Selecciona una puntuación</p>
      </div>

      <div class="field">
        <label>Comentario <span style="opacity:.4;font-size:.8rem">(opcional)</span></label>
        <textarea id="inp-comentario" placeholder="Escribe aquí el comentario del cliente…"></textarea>
      </div>

      <div class="msg" id="msg"></div>

      <div class="btns">
        <button class="btn-save" id="btn-save" onclick="guardar()">💾 Guardar cambios</button>
        <a href="index.html" class="btn-cancel">Cancelar</a>
      </div>
    </div>
  </div>
</div>

<script src="js/edit.js"></script>
</body>
</html>
