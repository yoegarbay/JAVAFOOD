<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Pedidos — JavaFood</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #d17a22; --orange2: #f0932b;
      --dark: #0d0804; --card: rgba(28,16,8,0.98);
      --cream: #f5e8d3; --muted: rgba(245,232,211,0.42);
      --border: rgba(209,122,34,0.20); --glow: rgba(209,122,34,0.28);
      --green: #4caf50; --red: #e05555;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Space Grotesk', sans-serif; background: var(--dark); color: var(--cream); min-height: 100vh; }

    /* Stats header — sin navbar feo */
    .page-hero {
      background: linear-gradient(135deg, #1a0d06, #0d0804);
      border-bottom: 2px solid var(--orange);
      padding: 28px 40px 0;
      box-shadow: 0 0 28px var(--glow);
    }
    .hero-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; }
    .hero-title h1 { font-size: 2.2rem; font-weight: 900; }
    .hero-title h1 span { color: var(--orange); }
    .hero-title p { opacity: .4; font-size: .88rem; margin-top: 4px; }
    .btn-volver {
      padding: 9px 20px; background: transparent;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--muted); text-decoration: none; font-weight: 600;
      font-size: .85rem; transition: .2s;
    }
    .btn-volver:hover { border-color: var(--orange); color: var(--cream); }

    .stats-bar {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
    }
    .stat-item { padding: 16px 24px; border-right: 1px solid var(--border); }
    .stat-item:last-child { border-right: none; }
    .stat-item .n { font-size: 1.7rem; font-weight: 900; color: var(--orange); line-height: 1; }
    .stat-item .l { font-size: .62rem; text-transform: uppercase; letter-spacing: .09em; opacity: .35; margin-top: 4px; }

    /* Toolbar */
    .toolbar {
      padding: 20px 40px; display: flex; gap: 12px; align-items: center;
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    .search-wrap input {
      width: 100%; padding: 10px 14px 10px 38px;
      background: rgba(0,0,0,.45); border: 1px solid var(--border);
      border-radius: 10px; color: var(--cream); font-family: inherit;
      font-size: .9rem; outline: none; transition: .2s;
    }
    .search-wrap input:focus { border-color: var(--orange); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .4; }

    select.filtro {
      padding: 10px 14px; background: rgba(0,0,0,.45);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--cream); font-family: inherit; font-size: .88rem;
      outline: none; cursor: pointer;
    }
    select.filtro:focus { border-color: var(--orange); }

    /* Pedidos */
    .pedidos-wrap { padding: 24px 40px; display: flex; flex-direction: column; gap: 16px; }

    .pedido-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; transition: .2s;
    }
    .pedido-card:hover { border-color: rgba(209,122,34,.4); }

    .pedido-head {
      padding: 16px 24px; display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      align-items: center; gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    .pedido-head .field-label {
      font-size: .6rem; text-transform: uppercase;
      letter-spacing: .08em; opacity: .35; margin-bottom: 4px;
    }
    .pedido-head .field-val { font-weight: 700; font-size: .95rem; }
    .total-val { color: var(--orange); font-size: 1.1rem; }
    .pedido-num { font-size: .75rem; color: var(--orange); opacity: .7; font-weight: 700; }

    .badge-estado {
      padding: 4px 12px; border-radius: 20px;
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
    }
    .badge-pagado    { background: rgba(76,175,80,.15); color: var(--green); border: 1px solid rgba(76,175,80,.3); }
    .badge-cancelado { background: rgba(224,85,85,.15); color: var(--red);   border: 1px solid rgba(224,85,85,.3); }
    .badge-pending   { background: rgba(255,160,0,.15);  color: #ffa000;     border: 1px solid rgba(255,160,0,.3); }

    .pedido-meta {
      padding: 10px 24px; background: rgba(0,0,0,.2);
      display: flex; align-items: center; gap: 10px;
      font-size: .82rem; opacity: .6;
      border-bottom: 1px solid var(--border);
    }
    .pago-badge {
      background: rgba(209,122,34,.1); border: 1px solid var(--border);
      color: var(--orange); padding: 2px 9px; border-radius: 6px;
      font-size: .72rem; font-weight: 600;
    }

    .pedido-lineas { padding: 12px 24px; display: flex; flex-direction: column; gap: 8px; }
    .linea-item {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0; border-bottom: 1px solid rgba(209,122,34,.06);
    }
    .linea-item:last-child { border-bottom: none; }
    .linea-icon { font-size: 1.3rem; }
    .linea-info { flex: 1; }
    .linea-nombre { font-weight: 600; font-size: .9rem; }
    .linea-detalle { font-size: .78rem; opacity: .45; margin-top: 2px; }
    .linea-precio { color: var(--orange); font-weight: 700; font-size: .92rem; white-space: nowrap; }

    #loading { text-align: center; padding: 80px; opacity: .5; font-size: 1rem; }
    #empty   { display: none; text-align: center; padding: 80px; opacity: .3; }
    .no-login {
      text-align: center; padding: 80px; opacity: .5;
    }
    .no-login a { color: var(--orange); }
  </style>
</head>
<body>

<div class="page-hero">
  <div class="hero-top">
    <div class="hero-title">
      <h1>Mis <span>Pedidos</span></h1>
      <p>Historial completo de tus compras</p>
    </div>
    <a href="/index.html" class="btn-volver">← Volver al menú</a>
  </div>
  <div class="stats-bar">
    <div class="stat-item"><span class="n" id="stat-total">—</span><span class="l">Pedidos</span></div>
    <div class="stat-item"><span class="n" id="stat-hoy">—</span><span class="l">Hoy</span></div>
    <div class="stat-item"><span class="n" id="stat-importe">—</span><span class="l">Total €</span></div>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="inp-buscar" placeholder="Buscar por producto…" oninput="filtrar()">
  </div>
  <select class="filtro" id="sel-estado" onchange="filtrar()">
    <option value="">Todos los estados</option>
    <option value="PAGADO">Pagado</option>
    <option value="CANCELADO">Cancelado</option>
  </select>
</div>

<div id="loading">Cargando tus pedidos…</div>
<div id="empty">No tienes pedidos registrados todavía.</div>
<div id="no-login" class="no-login" style="display:none">
  Debes <a href="/login.html">iniciar sesión</a> para ver tus pedidos.
</div>
<div class="pedidos-wrap" id="pedidos-wrap"></div>

<script>
let pedidosGlobal = [];

async function init() {
  const idCliente = sessionStorage.getItem('idCliente');
  if (!idCliente) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('no-login').style.display = 'block';
    return;
  }

  try {
    // Endpoint que devuelve solo los pedidos de este cliente
    const res = await fetch(`/api/pedidos/mis/${idCliente}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    pedidosGlobal = await res.json();
  } catch (err) {
    document.getElementById('loading').textContent = '❌ Error al cargar pedidos: ' + err.message;
    return;
  }

  actualizarStats(pedidosGlobal);
  renderizar(pedidosGlobal);
  document.getElementById('loading').style.display = 'none';
}

function renderizar(pedidos) {
  const wrap  = document.getElementById('pedidos-wrap');
  const empty = document.getElementById('empty');
  wrap.innerHTML = '';

  if (!pedidos.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  pedidos.forEach(p => {
    // Con SNAKE_CASE: id_pedido, nombre_cliente, metodo_pago, horas_calc
    const fecha   = formatFecha(p.fecha);
    const badgeCls = p.estado === 'PAGADO'    ? 'badge-pagado'
                   : p.estado === 'CANCELADO' ? 'badge-cancelado'
                   : 'badge-pending';

    const lineasHtml = (p.lineas || []).map(l => `
      <div class="linea-item">
        <span class="linea-icon">🍔</span>
        <div class="linea-info">
          <div class="linea-nombre">${l.nombre_producto}</div>
          <div class="linea-detalle">Cantidad: ${l.cantidad} · ${parseFloat(l.precio_unitario).toFixed(2)} € / ud.</div>
        </div>
        <span class="linea-precio">${parseFloat(l.subtotal).toFixed(2)} €</span>
      </div>
    `).join('');

    const div = document.createElement('div');
    div.className = 'pedido-card';
    div.dataset.estado = p.estado;
    div.dataset.texto  = JSON.stringify(p).toLowerCase();
    div.innerHTML = `
      <div class="pedido-head">
        <div>
          <div class="field-label">Pedido realizado</div>
          <div class="field-val">${fecha}</div>
        </div>
        <div>
          <div class="field-label">Total</div>
          <div class="field-val total-val">${parseFloat(p.total).toFixed(2)} €</div>
        </div>
        <div>
          <div class="field-label">Estado</div>
          <span class="badge-estado ${badgeCls}">${p.estado}</span>
        </div>
        <div class="pedido-num">PED-${String(p.id_pedido).padStart(3,'0')}</div>
      </div>
      <div class="pedido-meta">
        → ${fecha}
        <span class="badge-estado ${badgeCls}" style="font-size:.68rem;padding:2px 8px">${p.estado}</span>
        <span class="pago-badge">${p.metodo_pago || 'EFECTIVO'}</span>
      </div>
      <div class="pedido-lineas">${lineasHtml || '<p style="opacity:.4;font-size:.85rem">Sin productos</p>'}</div>
    `;
    wrap.appendChild(div);
  });
}

function filtrar() {
  const q      = document.getElementById('inp-buscar').value.toLowerCase();
  const estado = document.getElementById('sel-estado').value;
  const f = pedidosGlobal.filter(p => {
    const matchEstado = !estado || p.estado === estado;
    const matchTexto  = !q || JSON.stringify(p).toLowerCase().includes(q);
    return matchEstado && matchTexto;
  });
  renderizar(f);
}

function actualizarStats(pedidos) {
  document.getElementById('stat-total').textContent = pedidos.length;
  const hoy = new Date().toISOString().slice(0, 10);
  document.getElementById('stat-hoy').textContent =
    pedidos.filter(p => p.fecha && p.fecha.startsWith(hoy)).length;
  const total = pedidos.reduce((a, p) => a + parseFloat(p.total || 0), 0);
  document.getElementById('stat-importe').textContent = total.toFixed(0) + '€';
}

function formatFecha(f) {
  if (!f) return '—';
  try {
    const d = new Date(f.replace(' ', 'T'));
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return f; }
}

init();
</script>
</body>
</html>
