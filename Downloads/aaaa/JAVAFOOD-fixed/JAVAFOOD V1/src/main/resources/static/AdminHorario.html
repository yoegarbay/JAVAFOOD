<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaFood — Admin Horarios</title>
    <link rel="stylesheet" href="/css/JAVAFOOD.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="code-overlay"></div>

<div class="page-wrapper">
    <div class="page-header">
        <div class="header-left">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="30" stroke="#d17a22" stroke-width="3"/>
                <path d="M32 20V32L40 36" stroke="#d17a22" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <div>
                <h1>Java<span>Admin</span></h1>
                <p>Panel de Gestión de Turnos</p>
            </div>
        </div>
        <div class="header-controls">
            <a href="/" class="nav-btn" style="text-decoration:none;padding:10px 16px;border-radius:10px;border:1px solid rgba(245,232,211,0.15);color:var(--cream);font-size:.82rem;">🏠 Inicio</a>
            <a href="/horarios" class="nav-btn" style="text-decoration:none;padding:10px 16px;border-radius:10px;border:1px solid rgba(209,122,34,0.35);color:var(--primary-orange);font-size:.82rem;">📅 Ver Horarios</a>
            <a href="/admin/fichar" class="nav-btn" style="text-decoration:none;padding:10px 16px;border-radius:10px;border:1px solid rgba(231,76,60,0.35);color:#e74c3c;font-size:.82rem;">📋 Admin Fichajes</a>
            <div class="mes-nav">
                <button class="mes-btn" onclick="cambiarMes(-1)">‹</button>
                <div class="mes-nombre" id="mes-label">—</div>
                <button class="mes-btn" onclick="cambiarMes(1)">›</button>
            </div>
        </div>
    </div>

    <div class="admin-controls">
        <div class="empleados-tabs" id="empleados-tabs"></div>
        <button class="btn-save" onclick="agregarEmpleado()">+ Añadir Empleado</button>
    </div>

    <div class="resumen-mes" id="resumen-admin"></div>

    <div class="cal-grid" id="cal-grid"></div>
</div>

<!-- Modal editar turno -->
<div class="modal-overlay" id="modal-admin" onclick="if(event.target===this)cerrarAdminModal()">
    <div class="modal-content">
        <button class="modal-close" onclick="cerrarAdminModal()">×</button>
        <h2 id="admin-modal-titulo">Editar Turno</h2>
        <div class="modal-body">
            <label>Empleado</label>
            <input type="text" id="edit-emp-nombre" readonly style="margin-bottom:15px;">
            <label>Seleccionar Turno</label>
            <select id="edit-turno-select" style="margin-bottom:20px;"></select>
            <button class="confirm-btn" onclick="aplicarCambioTurno()">Actualizar Turno</button>
        </div>
    </div>
</div>

<script>
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let añoActual = new Date().getFullYear();
let mesActual = new Date().getMonth() + 1;
let empSelec = null;
let diaEditando = null;
let EMPLEADOS = [];
let TURNOS = [];
let HORARIOS = {}; // "empId-dia" => turnoCod

async function loadAll() {
    const [emps, turnos, hors] = await Promise.all([
        fetch('/api/empleados').then(r => r.json()),
        fetch('/api/horarios/turnos').then(r => r.json()),
        fetch(`/api/horarios?anyo=${añoActual}&mes=${mesActual}`).then(r => r.json())
    ]);
    EMPLEADOS = emps;
    TURNOS = turnos;
    HORARIOS = {};
    hors.forEach(h => { HORARIOS[`${h.empleadoId}-${h.dia}`] = h.turnoCod; });
    if (!empSelec && EMPLEADOS.length > 0) empSelec = EMPLEADOS[0].id;
    populateTurnoSelect();
    render();
}

function populateTurnoSelect() {
    const sel = document.getElementById('edit-turno-select');
    sel.innerHTML = TURNOS.map(t => `<option value="${t.codigo}">${t.emoji} ${t.nombre}</option>`).join('');
}

function getTurno(empId, dia) {
    return HORARIOS[`${empId}-${dia}`] || 'libre';
}

function render() {
    document.getElementById('mes-label').textContent = `${MESES[mesActual-1]} ${añoActual}`;
    buildTabs();
    buildResumen();
    buildCalendarioAdmin();
}

function buildTabs() {
    const cont = document.getElementById('empleados-tabs');
    cont.innerHTML = '';
    EMPLEADOS.forEach(e => {
        const btn = document.createElement('button');
        btn.className = 'tab-emp' + (empSelec === e.id ? ' active' : '');
        btn.innerHTML = `<span class="tab-dot" style="background:${e.color};"></span> ${e.nombre}`;
        btn.onclick = () => { empSelec = e.id; render(); };
        cont.appendChild(btn);
    });
}

function buildResumen() {
    const totalDias = new Date(añoActual, mesActual, 0).getDate();
    const cont = document.getElementById('resumen-admin');
    let cuentas = {};
    TURNOS.forEach(t => cuentas[t.codigo] = 0);
    for (let d = 1; d <= totalDias; d++) cuentas[getTurno(empSelec, d)] = (cuentas[getTurno(empSelec, d)] || 0) + 1;
    const horasTrab = ((cuentas.manana||0) + (cuentas.tarde||0) + (cuentas.noche||0) + (cuentas.partido||0)) * 8;
    cont.innerHTML = `
        <div class="res-card"><div class="res-num">${totalDias}</div><div class="res-label">Días del mes</div></div>
        <div class="res-card"><div class="res-num">${cuentas.manana||0}</div><div class="res-label">Mañanas</div></div>
        <div class="res-card"><div class="res-num">${cuentas.tarde||0}</div><div class="res-label">Tardes</div></div>
        <div class="res-card"><div class="res-num">${cuentas.noche||0}</div><div class="res-label">Noches</div></div>
        <div class="res-card"><div class="res-num">${cuentas.libre||0}</div><div class="res-label">Libres</div></div>
        <div class="res-card"><div class="res-num">${horasTrab}h</div><div class="res-label">Horas est.</div></div>
    `;
}

function buildCalendarioAdmin() {
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => {
        const el = document.createElement('div'); el.className = 'cal-dia-nombre'; el.textContent = d;
        grid.appendChild(el);
    });

    const primer = new Date(añoActual, mesActual - 1, 1);
    let diaInicio = primer.getDay() === 0 ? 6 : primer.getDay() - 1;
    const totalDias = new Date(añoActual, mesActual, 0).getDate();

    for (let i = 0; i < diaInicio; i++) {
        grid.appendChild(Object.assign(document.createElement('div'), {className: 'cal-celda vacio'}));
    }

    const TURNO_LABELS = {};
    TURNOS.forEach(t => TURNO_LABELS[t.codigo] = `${t.emoji} ${t.nombre}`);

    for (let d = 1; d <= totalDias; d++) {
        const cel = document.createElement('div');
        cel.className = 'cal-celda editable-cell';
        const t = getTurno(empSelec, d);
        cel.innerHTML = `
            <div class="num-dia">${d}</div>
            <div class="turno-chip turno-${t}">${TURNO_LABELS[t] || t}</div>
            <div style="font-size:.6rem;color:gray;margin-top:5px;">✏ Editar</div>
        `;
        cel.onclick = () => abrirAdminModal(d);
        grid.appendChild(cel);
    }
}

function abrirAdminModal(d) {
    diaEditando = d;
    const emp = EMPLEADOS.find(e => e.id === empSelec);
    document.getElementById('edit-emp-nombre').value = emp ? emp.nombre : '';
    document.getElementById('admin-modal-titulo').textContent = `Día ${d} — ${MESES[mesActual-1]} ${añoActual}`;
    document.getElementById('edit-turno-select').value = getTurno(empSelec, d);
    document.getElementById('modal-admin').classList.add('open');
}

async function aplicarCambioTurno() {
    const turno = document.getElementById('edit-turno-select').value;
    const body = { empleadoId: empSelec, anyo: añoActual, mes: mesActual, dia: diaEditando, turnoCod: turno };
    await fetch('/api/horarios', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    HORARIOS[`${empSelec}-${diaEditando}`] = turno;
    cerrarAdminModal();
    render();
}

function cerrarAdminModal() { document.getElementById('modal-admin').classList.remove('open'); }

function cambiarMes(delta) {
    mesActual += delta;
    if (mesActual < 1) { mesActual = 12; añoActual--; }
    if (mesActual > 12) { mesActual = 1; añoActual++; }
    loadAll();
}

async function agregarEmpleado() {
    const nombre = prompt('Nombre del nuevo empleado:');
    if (!nombre) return;
    const colores = ['#ffc107','#64b5f6','#bb8fce','#4caf50','#ff9800','#e74c3c','#26c6da','#ab47bc'];
    const color = colores[Math.floor(Math.random() * colores.length)];
    const iniciales = nombre.split(' ').map(p => p[0]).join('').substring(0,2).toUpperCase();
    await fetch('/api/empleados', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nombre, iniciales, color, activo:true}) });
    loadAll();
}

loadAll();
</script>
</body>
</html>
