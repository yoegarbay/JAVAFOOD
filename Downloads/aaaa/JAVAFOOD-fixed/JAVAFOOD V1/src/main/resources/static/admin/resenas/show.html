<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVAFOOD · Reseña</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--orange:#d17a22;--dark:#0d0804;--card:rgba(28,16,8,0.98);
    --cream:#f5e8d3;--muted:rgba(245,232,211,0.42);
    --border:rgba(209,122,34,0.20);--glow:rgba(209,122,34,0.28);
    --green:#4caf50;--red:#e05555;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;}
  nav{background:rgba(18,10,4,.98);border-bottom:2px solid var(--orange);
      box-shadow:0 0 28px var(--glow);padding:13px 32px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;}
  .brand{font-size:1.4rem;font-weight:900;color:#fff;text-decoration:none;}
  .brand span{color:var(--orange);}
  .brand small{font-size:.65rem;background:rgba(209,122,34,.18);color:var(--orange);
    border-radius:4px;padding:2px 7px;margin-left:8px;font-weight:700;
    text-transform:uppercase;vertical-align:middle;}
  .nav-links a{color:var(--cream);text-decoration:none;margin-left:18px;
    font-weight:600;opacity:.5;transition:.2s;font-size:.85rem;}
  .nav-links a:hover{color:var(--orange);opacity:1;}

  .page{max-width:640px;margin:0 auto;padding:40px 24px;}
  .breadcrumb{font-size:.8rem;opacity:.4;margin-bottom:24px;}
  .breadcrumb a{color:var(--orange);text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}

  .detail-card{background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:36px;box-shadow:0 0 40px rgba(0,0,0,.5);}
  .card-header{display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .card-header h2{font-size:1.3rem;font-weight:900;}
  .card-header h2 span{color:var(--orange);}
  .badge-id{background:rgba(209,122,34,.15);color:var(--orange);border-radius:6px;
    padding:4px 12px;font-size:.78rem;font-weight:700;white-space:nowrap;}

  .stars-big{font-size:2rem;color:#f5a623;letter-spacing:4px;margin-bottom:20px;}
  .stars-big .empty{color:#333;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
  .info-item .label{font-size:.65rem;text-transform:uppercase;letter-spacing:.09em;
    opacity:.38;margin-bottom:5px;}
  .info-item .value{font-size:.95rem;font-weight:600;color:var(--cream);}
  .info-item .value.orange{color:var(--orange);}

  .comentario-box{background:rgba(0,0,0,.3);border:1px solid var(--border);
    border-radius:12px;padding:18px 20px;font-size:.92rem;line-height:1.7;
    min-height:80px;margin-bottom:28px;}
  .comentario-box.empty{opacity:.35;font-style:italic;}

  .actions{display:flex;gap:12px;flex-wrap:wrap;}
  .btn-edit{padding:11px 28px;background:rgba(76,175,80,.15);
    border:1px solid rgba(76,175,80,.35);color:var(--green);border-radius:10px;
    text-decoration:none;font-weight:700;font-size:.9rem;transition:.2s;}
  .btn-edit:hover{background:rgba(76,175,80,.28);}
  .btn-del{padding:11px 28px;background:rgba(224,85,85,.15);
    border:1px solid rgba(224,85,85,.35);color:var(--red);border-radius:10px;
    font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;transition:.2s;}
  .btn-del:hover{background:rgba(224,85,85,.28);}
  .btn-back{padding:11px 28px;background:transparent;
    border:1px solid var(--border);color:var(--muted);border-radius:10px;
    text-decoration:none;font-weight:600;font-size:.9rem;transition:.2s;}
  .btn-back:hover{border-color:rgba(209,122,34,.5);color:var(--cream);}
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="brand">JAVA<span>FOOD</span><small>Admin</small></a>
  <div class="nav-links">
    <a href="/admin/peliculas/index.html">Productos</a>
    <a href="/admin/pagos/index.html">Pedidos</a>
    <a href="/admin/resenas/index.html">Reseñas</a>
  </div>
</nav>

<div class="page">
  <p class="breadcrumb">
    <a href="index.html">← Reseñas</a> / Detalle
  </p>

  <div id="loading" style="text-align:center;padding:60px 0;opacity:.5;">Cargando…</div>

  <div id="contenido" style="display:none">
    <div class="detail-card">
      <div class="card-header">
        <h2>Reseña <span id="titulo-id">#—</span></h2>
        <span class="badge-id" id="badge-fecha">—</span>
      </div>

      <div class="stars-big" id="stars-big">—</div>

      <div class="info-grid">
        <div class="info-item">
          <p class="label">Producto</p>
          <p class="value orange" id="info-producto">—</p>
        </div>
        <div class="info-item">
          <p class="label">Cliente</p>
          <p class="value" id="info-cliente">—</p>
        </div>
        <div class="info-item">
          <p class="label">Puntuación</p>
          <p class="value" id="info-puntuacion">—</p>
        </div>
        <div class="info-item">
          <p class="label">Fecha</p>
          <p class="value" id="info-fecha">—</p>
        </div>
      </div>

      <p style="font-size:.65rem;text-transform:uppercase;letter-spacing:.09em;opacity:.38;margin-bottom:10px;">Comentario</p>
      <div class="comentario-box" id="comentario-box">—</div>

      <div class="actions">
        <a id="btn-edit-link" href="#" class="btn-edit">✏️ Editar</a>
        <button class="btn-del" onclick="eliminar()">🗑 Eliminar</button>
        <a href="index.html" class="btn-back">← Volver</a>
      </div>
    </div>
  </div>
</div>

<script src="js/show.js"></script>
</body>
</html>
