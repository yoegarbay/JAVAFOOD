<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaFood — Admin Fichajes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --primary-orange:#d17a22; --coffee-dark:#2b1b12; --cream:#f5e8d3; --gold-glow:rgba(209,122,34,0.4); --glass-bg:rgba(43,27,18,0.85); }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Space Grotesk',sans-serif; }
body { background:#000; color:var(--cream); min-height:100vh; display:flex; flex-direction:column; align-items:center; overflow-x:hidden; padding:24px 16px 40px; position:relative; }
.code-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(rgba(0,0,0,0.82),rgba(0,0,0,0.82)),url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); opacity:0.3; z-index:-1; }
.top-bar { width:95%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px; }
.logo-area { display:flex; align-items:center; gap:12px; }
.logo-area svg { width:44px; filter:drop-shadow(0 0 8px var(--primary-orange)); }
.logo-area h1 { font-size:1.4rem; color:white; } .logo-area h1 span { color:var(--primary-orange); }
.nav-links { display:flex; gap:10px; }
.nav-btn { padding:9px 16px; border-radius:10px; border:1px solid rgba(245,232,211,0.15); background:transparent; color:var(--cream); cursor:pointer; font-family:inherit; font-size:.82rem; text-decoration:none; display:inline-block; transition:.2s; }
.nav-btn:hover { background:var(--primary-orange); color:var(--coffee-dark); font-weight:bold; border-color:var(--primary-orange); }
.clock-wrap { text-align:right; }
.clock-time { font-size:2.6rem; font-weight:900; color:var(--primary-orange); letter-spacing:3px; text-shadow:0 0 18px var(--primary-orange); line-height:1; }
.main-layout { width:95%; max-width:1100px; display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.panel-fichar { width:310px; flex-shrink:0; background:var(--glass-bg); border:2px solid var(--primary-orange); border-radius:28px; padding:28px 24px; box-shadow:0 0 40px var(--gold-glow); backdrop-filter:blur(12px); }
.section-label { font-size:.68rem; text-transform:uppercase; letter-spacing:3px; color:var(--primary-orange); border-bottom:1px solid rgba(209,122,34,0.3); padding-bottom:7px; margin-bottom:16px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:.75rem; font-weight:bold; color:var(--primary-orange); margin-bottom:7px; text-transform:uppercase; letter-spacing:1px; }
.form-group input { width:100%; padding:13px 16px; background:rgba(0,0,0,.45); border:1px solid var(--primary-orange); color:white; border-radius:12px; outline:none; font-family:inherit; font-size:1rem; }
.btn-add { width:100%; padding:15px; background:linear-gradient(45deg,#1e6e1e,#4caf50); border:none; border-radius:12px; color:white; font-weight:900; font-size:1rem; cursor:pointer; text-transform:uppercase; letter-spacing:1px; margin-bottom:20px; font-family:inherit; }
.panel-historial { flex:1; min-width:0; background:var(--glass-bg); border:1px solid rgba(209,122,34,0.35); border-radius:28px; padding:26px 22px; backdrop-filter:blur(12px); display:flex; flex-direction:column; min-height:560px; }
.hist-head { display:grid; grid-template-columns:1.4fr 90px 70px 90px 65px 30px; gap:6px; padding:7px 10px; font-size:.62rem; text-transform:uppercase; letter-spacing:2px; color:var(--primary-orange); border-bottom:1px solid rgba(209,122,34,0.25); margin-bottom:6px; }
.hist-fila { display:grid; grid-template-columns:1.4fr 90px 70px 90px 65px 30px; gap:6px; align-items:center; padding:9px 10px; border-radius:10px; border:1px solid rgba(209,122,34,0.1); background:rgba(0,0,0,.2); margin-bottom:5px; font-size:.83rem; }
.badge { display:inline-block; font-size:.66rem; padding:3px 8px; border-radius:20px; font-weight:bold; }
.badge-entrada { background:rgba(76,175,80,.18); color:#4caf50; border:1px solid #4caf50; }
.badge-salida  { background:rgba(231,76,60,.18); color:#e74c3c; border:1px solid #e74c3c; }
.btn-del { background:transparent; border:1px solid rgba(255,68,68,.28); color:rgba(255,100,100,.55); border-radius:6px; width:24px; height:24px; cursor:pointer; font-family:inherit; }
.emp-row { display:flex; justify-content:space-between; align-items:center; padding:10px; background:rgba(0,0,0,.3); border-radius:10px; margin-bottom:5px; border:1px solid rgba(209,122,34,0.1); }
.dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
</style>
</head>
<body>
<div class="code-overlay"></div>
<div class="top-bar">
    <div class="logo-area">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="30" stroke="#d17a22" stroke-width="3"/>
            <path d="M20 44 C20 44 24 20 32 20 C40 20 44 44 44 44" stroke="#d17a22" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="32" cy="46" rx="10" ry="3" fill="#d17a22" opacity="0.5"/>
        </svg>
        <div>
            <h1>Java<span>Food</span> — Admin Fichajes</h1>
        </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
        <div class="nav-links">
            <a href="/" class="nav-btn">🏠 Inicio</a>
            <a href="/fichar" class="nav-btn">🕐 Fichar</a>
            <a href="/admin/horarios" class="nav-btn">📅 Admin Horarios</a>
        </div>
        <div class="clock-wrap"><div class="clock-time" id="clock">00:00:00</div></div>
    </div>
</div>

<div class="main-layout">
    <div class="panel-fichar">
        <div class="section-label">Gestión de Equipo</div>
        <div class="form-group"><label>Nombre</label><input type="text" id="new-emp-nombre" placeholder="Nombre completo..."></div>
        <div class="form-group"><label>Color</label><input type="color" id="new-emp-color" value="#d17a22"></div>
        <button class="btn-add" onclick="addEmp()">+ Añadir Empleado</button>
        <div id="emp-list"></div>
    </div>

    <div class="panel-historial">
        <div class="section-label">Control de Presencia Total</div>
        <div class="hist-head">
            <span>Empleado</span><span>Fecha</span><span>Hora</span><span>Tipo</span><span>Horas</span><span></span>
        </div>
        <div id="admin-lista"></div>
    </div>
</div>

<script>
let EMPLEADOS = [];

function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }
setInterval(tick, 1000); tick();

async function loadAll() {
    const [emps, fichajes] = await Promise.all([
        fetch('/api/empleados/todos').then(r => r.json()),
        fetch('/api/fichajes').then(r => r.json())
    ]);
    EMPLEADOS = emps;
    renderEmpleados(emps);
    renderFichajes(fichajes);
}

function renderEmpleados(emps) {
    document.getElementById('emp-list').innerHTML = emps.map(e => `
        <div class="emp-row">
            <span><span class="dot" style="background:${e.color}"></span>${e.nombre} ${!e.activo?'<span style="color:#e74c3c;font-size:.7rem;">(baja)</span>':''}</span>
            <button onclick="darBaja(${e.id})" style="color:#e74c3c;background:none;border:none;cursor:pointer;font-family:inherit;">Baja</button>
        </div>
    `).join('');
}

function renderFichajes(fichajes) {
    document.getElementById('admin-lista').innerHTML = fichajes.map(f => `
        <div class="hist-fila">
            <span><span class="dot" style="background:${f.color}"></span>${f.nombre}</span>
            <span>${f.fecha}</span>
            <span>${(f.hora||'').substring(0,5)}</span>
            <span><span class="badge badge-${f.tipo}">${f.tipo}</span></span>
            <span>${f.horasCalc != null ? f.horasCalc+'h' : '--'}</span>
            <button class="btn-del" onclick="delFichaje(${f.id})">×</button>
        </div>
    `).join('') || '<p style="opacity:.5;text-align:center;margin-top:20px;">No hay fichajes registrados.</p>';
}

async function addEmp() {
    const nombre = document.getElementById('new-emp-nombre').value.trim();
    const color  = document.getElementById('new-emp-color').value;
    if (!nombre) return alert('Introduce el nombre del empleado');
    const iniciales = nombre.split(' ').map(p => p[0]).join('').substring(0,2).toUpperCase();
    const body = { nombre, iniciales, color, activo: true };
    await fetch('/api/empleados', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    document.getElementById('new-emp-nombre').value = '';
    loadAll();
}

async function darBaja(id) {
    if (!confirm('¿Dar de baja a este empleado?')) return;
    await fetch(`/api/empleados/${id}`, { method:'DELETE' });
    loadAll();
}

async function delFichaje(id) {
    if (!confirm('¿Eliminar este fichaje?')) return;
    await fetch(`/api/fichajes/${id}`, { method:'DELETE' });
    loadAll();
}

loadAll();
</script>
</body>
</html>
