<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Fichajes — JavaFood</title>
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #e0d0c0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; gap: 16px; padding: 0 28px; height: 62px; background: #111; border-bottom: 1px solid #2a1505; flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: bold; }
    .logo-circle { width: 34px; height: 34px; border: 2px solid #d17a22; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #d17a22; }
    nav { display: flex; gap: 8px; margin-left: 12px; }
    nav a { padding: 5px 14px; border: 1px solid #444; border-radius: 6px; color: #bbb; text-decoration: none; font-size: .82rem; transition: all .2s; }
    nav a:hover, nav a.active { background: #2a1505; border-color: #d17a22; color: #d17a22; }
    .clock { margin-left: auto; font-size: 1.9rem; font-weight: bold; color: #d17a22; font-variant-numeric: tabular-nums; letter-spacing: 2px; }

    .main { display: flex; gap: 20px; padding: 20px 28px; flex: 1; overflow: hidden; }

    .panel-left { width: 270px; flex-shrink: 0; background: #1a0d04; border: 1px solid #3a1e08; border-radius: 10px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .panel-title { font-size: .65rem; letter-spacing: 3px; color: #886655; text-transform: uppercase; margin-bottom: 2px; }
    label { font-size: .7rem; color: #998877; letter-spacing: 1px; text-transform: uppercase; }
    input[type=text], input[type=color], select { width: 100%; padding: 9px 11px; background: #0d0700; border: 1px solid #3a1e08; border-radius: 7px; color: #e0d0c0; font-size: .88rem; outline: none; transition: border .2s; }
    input[type=color] { height: 38px; padding: 3px 7px; cursor: pointer; }
    input:focus, select:focus { border-color: #d17a22; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 7px; font-weight: bold; font-size: .88rem; cursor: pointer; transition: filter .2s; }
    .btn:hover { filter: brightness(1.2); }
    .btn-green { background: #1e6b1e; color: #c8f0c8; }
    .btn-red   { background: #7a1c1c; color: #f0c8c8; }
    hr { border: none; border-top: 1px solid #2a1205; margin: 2px 0; }

    .emp-list { display: flex; flex-direction: column; gap: 5px; }
    .emp-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; background: #0d0700; border-radius: 7px; font-size: .85rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .emp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-baja { font-size: .65rem; color: #665544; background: #1a0d04; padding: 1px 5px; border-radius: 4px; }
    .btn-sm { font-size: .72rem; padding: 3px 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-sm-edit { background: #1e3d6b; color: #a0c8f0; }
    .btn-sm-baja { background: #4a1010; color: #f0c8c8; }
    .btn-sm:hover { filter: brightness(1.3); }

    .panel-right { flex: 1; background: #1a0d04; border: 1px solid #3a1e08; border-radius: 10px; padding: 18px 16px; display: flex; flex-direction: column; overflow: hidden; }
    .table-wrap { overflow-y: auto; flex: 1; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    thead th { text-align: left; padding: 6px 10px; font-size: .65rem; letter-spacing: 2px; color: #886655; text-transform: uppercase; border-bottom: 1px solid #2a1205; }
    tbody tr:hover { background: #200d04; }
    td { padding: 9px 10px; border-bottom: 1px solid #160802; vertical-align: middle; }
    .emp-cell { display: flex; align-items: center; gap: 8px; }
    .badge { padding: 3px 11px; border-radius: 20px; font-size: .72rem; font-weight: bold; text-transform: uppercase; }
    .badge-entrada { background: #0d3d0d; color: #4dbb4d; border: 1px solid #1a5c1a; }
    .badge-salida  { background: #3d0d0d; color: #e05555; border: 1px solid #5c1a1a; }
    .horas-val  { color: #d17a22; font-weight: bold; }
    .horas-null { color: #554433; }
    .btn-del { background: #3a0000; border: 1px solid #7a2020; color: #e05555; border-radius: 5px; width: 24px; height: 24px; cursor: pointer; font-size: .9rem; display: flex; align-items: center; justify-content: center; }
    .btn-del:hover { background: #5a0000; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 200; }
    .modal-overlay.open { display: flex; }
    .modal { background: #1a0d04; border: 1px solid #d17a22; border-radius: 12px; padding: 28px 24px; width: 340px; display: flex; flex-direction: column; gap: 12px; }
    .modal h3 { font-size: 1rem; color: #d17a22; }
    .modal input[type=text], .modal input[type=password], .modal input[type=color] { width: 100%; padding: 9px 11px; background: #0d0700; border: 1px solid #3a1e08; border-radius: 7px; color: #e0d0c0; font-size: .88rem; outline: none; }
    .modal input:focus { border-color: #d17a22; }
    .pin-hint { font-size: .75rem; color: #886655; margin-top: -6px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
    .modal-btns .btn { flex: 1; }
    .btn-cancel-modal { background: #2a1205; color: #998877; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-circle">⚡</div>
    <span>JavaFood — Admin Fichajes</span>
  </div>
  <nav>
    <a href="/index.html">🏠 Inicio</a>
    <a href="/fichar.html">● Fichar</a>
    <a href="/AdminHorarios.html" class="active">📅 Admin Horarios</a>
  </nav>
  <div class="clock" id="clock">00:00:00</div>
</header>

<div class="main">

  <div class="panel-left">
    <div class="panel-title">Gestión de equipo</div>

    <label>Nombre</label>
    <input type="text" id="inp-nombre" placeholder="Nombre completo...">

    <label>Color</label>
    <input type="color" id="inp-color" value="#d17a22">

    <button class="btn btn-green" onclick="addEmpleado()">+ Añadir empleado</button>

    <hr>

    <label>Borrar empleado</label>
    <select id="sel-borrar">
      <option value="">— Selecciona empleado —</option>
    </select>
    <button class="btn btn-red" onclick="borrarEmpleado()">− Borrar empleado</button>

    <hr>

    <div class="emp-list" id="emp-list">
      <div style="color:#554433;font-size:.8rem">Cargando...</div>
    </div>
  </div>

  <div class="panel-right">
    <div class="panel-title">Control de presencia total</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Empleado</th><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Horas</th><th></th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" style="color:#554433;text-align:center;padding:20px">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal editar empleado: nombre + color + PIN -->
<div class="modal-overlay" id="modal-overlay" onclick="cerrarModalClick(event)">
  <div class="modal">
    <h3>✏️ Editar empleado</h3>
    <input type="hidden" id="modal-id">
    <label>Nombre</label>
    <input type="text" id="modal-nombre" placeholder="Nombre completo...">
    <label>Color</label>
    <input type="color" id="modal-color">
    <label>Asignar / cambiar PIN</label>
    <input type="password" id="modal-pin" maxlength="6" placeholder="••••••" inputmode="numeric">
    <p class="pin-hint">Dejar vacío para no modificar el PIN actual</p>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="guardarEdicion()">💾 Guardar</button>
      <button class="btn btn-cancel-modal" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
/* Reloj */
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0') + ':' + String(n.getSeconds()).padStart(2,'0');
}
setInterval(tick, 1000); tick();

let empleadosCache = [];

async function loadEmpleados() {
  const res = await fetch('/api/empleados/todos');
  empleadosCache = await res.json();
  const list = document.getElementById('emp-list');
  const sel  = document.getElementById('sel-borrar');
  list.innerHTML = '';
  sel.innerHTML  = '<option value="">— Selecciona empleado —</option>';

  empleadosCache.forEach(e => {
    const div = document.createElement('div');
    div.className = 'emp-item';
    div.innerHTML = `
      <span class="dot" style="background:${e.color}"></span>
      <span class="emp-name">${e.nombre}${!e.activo ? ' <span class="tag-baja">(baja)</span>' : ''}</span>
      ${e.activo ? `
        <button class="btn-sm btn-sm-edit" onclick="abrirModal(${e.id})">Editar</button>
        <button class="btn-sm btn-sm-baja" onclick="darBaja(${e.id})">Baja</button>
      ` : ''}
    `;
    list.appendChild(div);
    if (e.activo) {
      const opt = document.createElement('option');
      opt.value = e.id; opt.textContent = e.nombre;
      sel.appendChild(opt);
    }
  });
}

async function addEmpleado() {
  const nombre = document.getElementById('inp-nombre').value.trim();
  const color  = document.getElementById('inp-color').value;
  if (!nombre) { alert('Introduce un nombre'); return; }
  const iniciales = nombre.split(' ').filter(Boolean).map(p => p[0].toUpperCase()).join('').slice(0,4);
  await fetch('/api/empleados', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nombre, iniciales, color, activo: true, pin: null })
  });
  document.getElementById('inp-nombre').value = '';
  loadEmpleados();
}

async function darBaja(id) {
  if (!confirm('¿Dar de baja a este empleado?')) return;
  await fetch('/api/empleados/' + id, { method: 'DELETE' });
  loadEmpleados(); loadFichajes();
}

async function borrarEmpleado() {
  const id = document.getElementById('sel-borrar').value;
  if (!id) { alert('Selecciona un empleado'); return; }
  if (!confirm('¿Borrar definitivamente este empleado y todos sus fichajes?')) return;
  await fetch('/api/empleados/' + id, { method: 'DELETE' });
  loadEmpleados(); loadFichajes();
}

/* Modal */
function abrirModal(id) {
  const e = empleadosCache.find(x => x.id === id);
  if (!e) return;
  document.getElementById('modal-id').value     = id;
  document.getElementById('modal-nombre').value = e.nombre;
  document.getElementById('modal-color').value  = e.color;
  document.getElementById('modal-pin').value    = '';
  document.getElementById('modal-overlay').classList.add('open');
}
function cerrarModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function cerrarModalClick(ev) { if (ev.target === document.getElementById('modal-overlay')) cerrarModal(); }

async function guardarEdicion() {
  const id     = parseInt(document.getElementById('modal-id').value);
  const nombre = document.getElementById('modal-nombre').value.trim();
  const color  = document.getElementById('modal-color').value;
  const pin    = document.getElementById('modal-pin').value.trim();
  if (!nombre) { alert('El nombre no puede estar vacío'); return; }
  const e = empleadosCache.find(x => x.id === id);
  const iniciales = nombre.split(' ').filter(Boolean).map(p => p[0].toUpperCase()).join('').slice(0,4);
  const pinFinal  = pin || (e ? e.pin : null);
  await fetch('/api/empleados/' + id, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nombre, iniciales, color, activo: true, pin: pinFinal || null })
  });
  cerrarModal();
  loadEmpleados();
}

/* Fichajes */
async function loadFichajes() {
  const res     = await fetch('/api/fichajes');
  const fichajes = await res.json();
  const tbody   = document.getElementById('tbody');
  tbody.innerHTML = '';
  if (!fichajes.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:#554433;text-align:center;padding:20px">Sin fichajes</td></tr>';
    return;
  }
  fichajes.forEach(f => {
    // SNAKE_CASE: Jackson devuelve horas_calc (no horasCalc)
    const hc   = f.horas_calc;
    const hStr = hc != null ? hc + ' h' : '—';
    const hCls = hc != null ? 'horas-val' : 'horas-null';
    const tr   = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="emp-cell"><span class="dot" style="background:${f.color}"></span>${f.nombre}</div></td>
      <td>${f.fecha}</td>
      <td>${f.hora ? f.hora.slice(0,5) : '—'}</td>
      <td><span class="badge badge-${f.tipo}">${f.tipo}</span></td>
      <td class="${hCls}">${hStr}</td>
      <td><button class="btn-del" onclick="deleteFichaje(${f.id})">×</button></td>
    `;
    tbody.appendChild(tr);
  });
}

async function deleteFichaje(id) {
  await fetch('/api/fichajes/' + id, { method: 'DELETE' });
  loadFichajes();
}

loadEmpleados();
loadFichajes();
setInterval(loadFichajes, 30000);
</script>
</body>
</html>
