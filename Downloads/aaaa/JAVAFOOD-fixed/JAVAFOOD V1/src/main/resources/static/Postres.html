<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaFood | Postres Sweet Tech</title>
    <link rel="stylesheet" href="JAVAFOOD.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="code-overlay"></div>

    <div class="kiosk-container">
      <aside class="sidebar">
        <div class="logo-area">
          <img
            src="Javafoodlogo.png"
            alt="Logo"
            class="main-logo"
          />
          <h1>Java<span>Food</span></h1>
        </div>

        <nav class="nav-links">
            <button class="nav-btn" onclick="location.href='Menus.html'">🍱 MENÚS</button>
            <button class="nav-btn" onclick="location.href='Principales.html'">🍔 PRINCIPALES</button>
            <button class="nav-btn" onclick="location.href='Complementos.html'">🍟 COMPLEMENTOS</button>
            <button class="nav-btn" onclick="location.href='Salsas.html'">🍯 SALSAS</button>
            <button class="nav-btn" onclick="location.href='Bebidas.html'">🥤 BEBIDAS</button>
			 <button class="nav-btn active">🎂 POSTRES</button>
			<button class="nav-btn" onclick="location.href='Promociones.html'">🎁 PROMOCIONES</button>
        </nav>

        <div class="cart-box">
          <h3>Tu Pedido</h3>
          <div id="cart-items-container" class="cart-items-scroll"></div>

          <div class="total-row">
            <span>Total:</span>
            <span class="total-price">0.00€</span>
          </div>
          <button class="pay-btn">PAGAR AHORA</button>
          <button id="clear-cart" class="clear-btn" onclick="carrito=[];guardarCarrito();">🗑️ Vaciar pedido</button>
        </div>
      </aside>

      <main class="main-view">
        <header class="top-info">
          <span>Explorando: <strong>POSTRES</strong></span>
          <div id="auth-area"></div>
        </header>

        <div class="promo-banner secondary">
          <div class="promo-content">
            <h2>NUESTROS <br /><span>POSTRES</span></h2>
            <p>El cierre perfecto para tu ejecución.</p>
          </div>
          <span style="font-size: 80px">🍰</span>
        </div>

        <div class="food-grid" id="grid-postres">
          <p style="color:#aaa;padding:20px;" id="postres-loading">Cargando postres…</p>
        </div>

      </main>
    </div>
  <script src="main.js"></script>
<script>
  const POSTRES_FALLBACK = [
    { nombre: 'JavaFusion Oreo y Chocolate Blanco', precio: 3.50 },
    { nombre: 'JavaFusion Kinder Bueno y Nutella',  precio: 3.50 },
    { nombre: 'JavaFusion Huesitos y Caramelo',     precio: 3.50 },
    { nombre: 'EuroCono',                           precio: 1.00 },
    { nombre: 'Sundae',                             precio: 2.50 },
    { nombre: 'Sundae Chocolate',                   precio: 2.50 },
    { nombre: 'Sundae Chocolate Blanco',            precio: 2.50 },
    { nombre: 'Sundae Caramelo',                    precio: 2.50 },
    { nombre: 'Sundae Fresa',                       precio: 2.50 },
    { nombre: 'Magdalena',                          precio: 2.50 },
    { nombre: 'Magdalena Chocolate',                precio: 2.50 },
    { nombre: 'Donut',                              precio: 1.50 },
    { nombre: 'Donut Relleno de Chocolate',         precio: 3.00 },
    { nombre: 'Donut Relleno de Crema',             precio: 3.00 },
    { nombre: 'Batido Fresa y Nata',                precio: 4.50 },
    { nombre: 'Batido Kit kat',                     precio: 4.50 },
    { nombre: 'Batido Plátano y Caramelo',          precio: 4.50 },
    { nombre: 'Tarta de Queso',                     precio: 3.50 }
  ];

  function renderPostres(items) {
    const grid = document.getElementById('grid-postres');
    if (!items.length) {
      grid.innerHTML = '<p style="color:#aaa;padding:20px;">No hay postres disponibles.</p>';
      return;
    }
    grid.innerHTML = items.map(p => {
      const idAttr = p.id_producto ? ' data-id="' + p.id_producto + '"' : '';
      const imgSrc = p.id_producto ? 'Imagenes/Postres/' + encodeURIComponent(p.nombre) + '.jpg' : '';
      return '<div class="card"' + idAttr + '>' +
        '<img src="' + imgSrc + '" alt="' + p.nombre + '" onerror="this.style.display='none'" ' +
          'style="width:100%;height:140px;object-fit:cover;border-radius:15px;">' +
        '<div class="card-body">' +
          '<h4>' + p.nombre + '</h4>' +
          '<div class="card-price">' +
            '<span>' + Number(p.precio).toFixed(2) + '€</span>' +
            '<button class="add-btn">+</button>' +
          '</div>' +
          '<div class="card-stars">★★★★★</div>' +
        '</div>' +
      '</div>';
    }).join('');
    if (typeof cargarEstrellasGrid === 'function') cargarEstrellasGrid('grid-postres');
  }

  (async function cargarPostres() {
    let items = POSTRES_FALLBACK;
    try {
      const res = await fetch('/api/productos/categoria/Postres');
      if (res.ok) {
        const data = await res.json();
        if (data.length > 0) items = data;
      }
    } catch (e) { /* usa fallback */ }
    renderPostres(items);
  })();
</script>
<script src="resenas.js"></script>
<script src="auth-rol.js"></script>
</body>
</html>
